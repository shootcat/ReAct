name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Simulation tests, UI smoke test and APK
        run: ./gradlew :sim:test :app:testDebugUnitTest assembleDebug --stacktrace

      - name: Name APK and write release notes
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk REACT-beta.apk
          {
            echo "Automatischer Beta-Build ${{ github.run_number }} aus \`${{ github.ref_name }}\` (${{ github.sha }})."
            echo
            echo "**Installation:** \`REACT-beta.apk\` auf dem Android-Gerät öffnen und installieren."
            echo "Jeder Build ist mit demselben Schlüssel signiert und installiert sich als Update über den vorherigen."
            echo
            echo "**Leistung auf dem Gerät messen:** im Spielplatz oben rechts das Zahnrad, dann „Leistung messen“."
            echo "Das Ergebnis lässt sich mit „Kopieren“ weitergeben."
            echo
            echo "Zum Vergleich, gemessen auf dem CI-Rechner (JVM, kein Handy):"
            echo
            echo '```'
            cat sim/build/benchmark.md
            echo '```'
          } > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: REACT-beta-${{ github.run_number }}
          path: |
            REACT-beta.apk
            app/build/screenshots/*.png
            sim/build/pictures/*.png
            sim/build/benchmark.md

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            sim/build/reports/tests/
            app/build/reports/tests/

      - name: Publish release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: REACT Beta ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            REACT-beta.apk
            app/build/screenshots/*.png
          body_path: release-notes.md
